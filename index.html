
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AARATRIKA.AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100d19;color:#f3eaff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;
}
.app{
 width:100%;max-width:760px;height:100dvh;
 display:flex;flex-direction:column;
 background:#171222;border-left:1px solid #38284c;
 border-right:1px solid #38284c;
}
header{
 padding:19px 20px;background:#211832;
 border-bottom:1px solid #49345f;
 display:flex;align-items:center;gap:13px;
}
.avatar{
 width:45px;height:45px;border-radius:50%;
 background:linear-gradient(135deg,#b48be2,#63458b);
 display:grid;place-items:center;font-size:22px;
}
.brand{flex:1}
.brand h1{font-size:17px;letter-spacing:2px;margin:0}
.brand p{font-size:11px;color:#b8a5ca;margin:5px 0 0}
.status{font-size:10px;color:#9ce3bb}
#clear{
 border:1px solid #604b78;background:transparent;
 color:#d9c4f1;padding:9px;border-radius:8px;
}
.notice{
 text-align:center;font-size:10px;color:#a996bb;
 padding:9px;border-bottom:1px solid #30243e;
}
#chat{
 flex:1;overflow-y:auto;padding:20px 14px;
 display:flex;flex-direction:column;gap:17px;
}
.message{display:flex;flex-direction:column;max-width:85%;gap:5px}
.message.user{align-self:flex-end;align-items:flex-end}
.message.bot{align-self:flex-start}
.name{font-size:10px;color:#a995c0;padding:0 5px}
.bubble{
 padding:12px 15px;border-radius:16px;
 font-size:14px;line-height:1.55;white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user .bubble{
 background:#66468a;border-bottom-right-radius:4px;
}
.bot .bubble{
 background:#30243e;border:1px solid #49365c;
 border-bottom-left-radius:4px;
}
#typing{color:#bda4d6;font-size:12px;padding:0 18px 10px;display:none}
.suggestions{
 display:flex;gap:8px;overflow-x:auto;padding:10px 13px;
 scrollbar-width:none;
}
.suggestions button{
 flex-shrink:0;background:#261b35;color:#d8c5ec;
 border:1px solid #59416e;border-radius:20px;
 padding:9px 12px;font-size:11px;
}
.composer{
 display:flex;gap:9px;padding:13px;
 background:#211832;border-top:1px solid #49345f;
}
#input{
 flex:1;min-width:0;resize:none;max-height:110px;
 border:1px solid #57416b;border-radius:13px;
 background:#130f1e;color:white;padding:13px;
 font:14px Arial;outline:none;
}
#input:focus{border-color:#bb91e9}
#send{
 width:48px;border:0;border-radius:12px;
 background:#9568bd;color:white;font-size:20px;
}
#send:disabled{opacity:.45}
footer{font-size:9px;text-align:center;color:#887895;padding:7px}
@media(min-width:700px){
 body{padding:20px}
 .app{height:calc(100dvh - 40px);border-radius:17px;overflow:hidden}
}
</style>
</head>
<body>
<div class="app">

<header>
 <div class="avatar">✦</div>
 <div class="brand">
  <h1>AARATRIKA.AI</h1>
  <p>a little chaos, powered by AI</p>
 </div>
 <div class="status">● READY</div>
 <button id="clear" title="Clear conversation">↻</button>
</header>

<div class="notice">
 AI PERSONALITY SIMULATION · NOT THE REAL AARATRIKA
</div>

<main id="chat">
 <div class="message bot">
  <span class="name">AARATRIKA.AI</span>
  <div class="bubble">Hiii 😭

Wtf are you doing here. Ask something na.</div>
 </div>
</main>

<div id="typing">Aaratrika is typing...</div>

<div class="suggestions">
 <button data-prompt="Tell me something random.">Say something random</button>
 <button data-prompt="Roast me.">Roast me</button>
 <button data-prompt="Explain why the sky is blue.">Explain something</button>
 <button data-prompt="I'm having a bad day.">I'm having a bad day</button>
</div>

<div class="composer">
 <textarea id="input" rows="1" placeholder="Type something..."></textarea>
 <button id="send">➤</button>
</div>
<footer>Made with curiosity, inside jokes and a little artificial intelligence.</footer>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const typing=document.getElementById("typing");

let history=[];

function addMessage(text,type){
 const wrap=document.createElement("div");
 wrap.className="message "+type;

 const name=document.createElement("span");
 name.className="name";
 name.textContent=type==="user"?"YOU":"AARATRIKA.AI";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 wrap.append(name,bubble);
 chat.appendChild(wrap);
 chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(text){
 text=text.trim();
 if(!text||send.disabled)return;

 addMessage(text,"user");
 history.push({role:"user",content:text});

 input.value="";
 input.style.height="auto";
 send.disabled=true;
 typing.style.display="block";

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({messages:history.slice(-16)})
  });

  const data=await response.json();

  if(!response.ok)throw new Error(data.error||"Something went wrong.");

  const reply=data.reply||"Wtf😭 I have nothing to say.";
  addMessage(reply,"bot");
  history.push({role:"assistant",content:reply});

 }catch(error){
  addMessage("AYO 😭 Something went wrong. "+error.message,"bot");
  history.pop();
 }finally{
  typing.style.display="none";
  send.disabled=false;
  input.focus();
 }
}

send.addEventListener("click",()=>sendMessage(input.value));

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage(input.value);
 }
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,110)+"px";
});

document.querySelectorAll(".suggestions button").forEach(button=>{
 button.addEventListener("click",()=>{
  sendMessage(button.dataset.prompt);
 });
});

document.getElementById("clear").addEventListener("click",()=>{
 history=[];
 chat.innerHTML="";
 addMessage("Wapas aa gaye? 😭 Ask something.","bot");
});

</script>
</body>
</html>
