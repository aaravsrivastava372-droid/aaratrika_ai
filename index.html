
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AARATRIKA.AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100d18;color:#f5edff;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;min-height:100vh;
}
.app{
 width:100%;max-width:780px;height:100dvh;
 display:flex;flex-direction:column;
 background:#191323;border:1px solid #382848;
}
header{
 padding:17px;display:flex;align-items:center;gap:12px;
 background:#251a33;border-bottom:1px solid #49365b;
}
.avatar{
 width:44px;height:44px;border-radius:50%;
 background:linear-gradient(135deg,#d4a8f5,#72509c);
 display:grid;place-items:center;font-size:23px;
}
.brand{flex:1}
.brand h1{margin:0;font-size:17px;letter-spacing:2px}
.brand p{margin:5px 0 0;font-size:10px;color:#bba6d0}
.online{font-size:10px;color:#9ce2b5}
#reset{
 background:transparent;border:1px solid #644b79;
 color:#e4d0f7;padding:9px;border-radius:9px;
}
.disclaimer{
 text-align:center;padding:9px;font-size:9px;
 color:#aa98bd;border-bottom:1px solid #382b47;
}
.modes{
 display:flex;gap:7px;padding:12px;
 overflow-x:auto;scrollbar-width:none;
 border-bottom:1px solid #382b47;
}
.modes button{
 white-space:nowrap;background:#2a2036;
 border:1px solid #59416e;color:#cdb8e0;
 border-radius:20px;padding:8px 12px;font-size:11px;
}
.modes button.active{
 background:#76539a;color:white;border-color:#b28bd4;
}
#chat{
 flex:1;overflow-y:auto;padding:17px 13px;
 display:flex;flex-direction:column;gap:16px;
}
.message{max-width:88%;display:flex;flex-direction:column;gap:5px}
.message.user{align-self:flex-end;align-items:flex-end}
.message.bot{align-self:flex-start}
.name{font-size:10px;color:#b39acb;padding:0 5px}
.bubble{
 padding:12px 15px;border-radius:15px;
 font-size:14px;line-height:1.55;
 white-space:pre-wrap;overflow-wrap:anywhere;
}
.user .bubble{background:#76539a;border-bottom-right-radius:4px}
.bot .bubble{
 background:#30243d;border:1px solid #49375b;
 border-bottom-left-radius:4px;
}
#typing{display:none;padding:0 17px 9px;color:#c2a6db;font-size:11px}
.suggestions{
 display:flex;gap:8px;overflow-x:auto;padding:10px 12px;
 scrollbar-width:none;
}
.suggestions button{
 flex-shrink:0;background:#271d34;
 border:1px solid #59416c;color:#d9c7e9;
 padding:9px 12px;border-radius:20px;font-size:11px;
}
.composer{
 display:flex;gap:9px;padding:12px;
 background:#251a33;border-top:1px solid #49365b;
}
#input{
 flex:1;min-width:0;resize:none;max-height:110px;
 background:#130e1b;border:1px solid #58416d;
 color:white;border-radius:12px;padding:13px;
 font:14px Arial;outline:none;
}
#input:focus{border-color:#c19be4}
#send{
 width:48px;border:0;border-radius:12px;
 background:#956cbb;color:white;font-size:20px;
}
footer{
 text-align:center;color:#897995;font-size:9px;padding:8px;
}
@media(min-width:700px){
 body{padding:20px}
 .app{height:calc(100dvh - 40px);border-radius:17px;overflow:hidden}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="avatar">✦</div>
 <div class="brand">
  <h1>AARATRIKA.AI</h1>
  <p>your favourite chaos, simulated.</p>
 </div>
 <span class="online">● ONLINE</span>
 <button id="reset">↻</button>
</header>

<div class="disclaimer">
 AN UNOFFICIAL AI-STYLE SIMULATION · NOT THE REAL PERSON
</div>

<div class="modes" id="modes">
 <button class="active" data-mode="normal">Normal</button>
 <button data-mode="angry">Angry</button>
 <button data-mode="affection">Affection</button>
 <button data-mode="dramatic">Dramatic</button>
 <button data-mode="philosophical">Philosophical</button>
</div>

<main id="chat">
 <div class="message bot">
  <span class="name">AARATRIKA.AI</span>
  <div class="bubble">Hiiii 😭

Wtf are you doing here.

Ask something na.</div>
 </div>
</main>

<div id="typing">Aaratrika is typing...</div>

<div class="suggestions">
 <button data-prompt="Hii">Say hi</button>
 <button data-prompt="I miss you">I miss you</button>
 <button data-prompt="Roast me">Roast me</button>
 <button data-prompt="Are you blushing?">Are you blushing?</button>
 <button data-prompt="Tell me something interesting">Tell me something</button>
</div>

<div class="composer">
 <textarea id="input" rows="1" placeholder="Type something..."></textarea>
 <button id="send">➤</button>
</div>

<footer>Built with inside jokes, chaos and questionable government policies.</footer>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const typing=document.getElementById("typing");

let mode="normal";
let history=[];
let lastTopic="";
let messageCount=0;

const replies={
 normal:[
  "Gawarrr 😭",
  "Wtf😭😭😭",
  "Fuck off",
  "Haaan bolo",
  "Kya chahiye ab",
  "Rand ho tum",
  "Mai kya karu iska ab 😭",
  "Acchaaaa",
  "Government ki mkc 100000 Baar",
  "Bgmi khelteyeye",
  "Karke dikhao",
  "WAAH. Kya baat hai.",
  "Tumhara dimaag theek hai?",
  "😭😭😭"
 ],
 angry:[
  "Okay listen. The problem isn't just what happened. It's that you don't seem to understand why it bothered me in the first place. I shouldn't have to explain the same thing repeatedly for it to be taken seriously.",
  "See, I am not angry for no reason. There is an actual reason behind it, and I want you to understand that instead of immediately defending yourself. Let me finish explaining first.",
  "You know what bothers me? When I try to explain something properly and it gets reduced to me overreacting. I am telling you how something made me feel. That should be enough reason to listen.",
  "I don't expect you to read my mind. But I do expect you to listen when I actually tell you what's wrong."
 ],
 affection:[
  "Love you too 😭",
  "Chup. Gawar.",
  "Wtf why are you being like this 😭",
  "Acha bas ab.",
  "Mai nahi bataungi.",
  "Tum bhi na.",
  "Shut up. Literally.",
  "Haan haan jao ab 😭",
  "Nahi kar rahi blush. Pagal ho kya?"
 ],
 dramatic:[
  "EK JHAAPAD MARUNGI NA 😭",
  "HAATH TOD DUNGI.",
  "GOVERNMENT KI MKC 100000 BAAR.",
  "MERE SAATH HI KYU HOTA HAI YE SAB.",
  "I CANNOT WITH YOU.",
  "WTF IS THIS 😭😭😭",
  "BHAI BAS. BAS KARO.",
  "Mai toh lesbian hu 💀"
 ],
 philosophical:[
  "I think people are much more complicated than the versions of themselves they show everyone. Sometimes even they don't fully understand why they behave the way they do.",
  "It's interesting how two people can experience the same situation and remember completely different things. Memory isn't just a recording. It's also interpretation.",
  "Maybe growing up is partly learning that not everything has a neat explanation. Some things can matter to us even when we cannot completely understand them.",
  "I don't think people are entirely good or entirely bad. Most of us are just contradictions trying to make sense of ourselves."
 ]
};

const patterns=[
 {
  test:/^(hi|hii+|hello|hey)\b/i,
  answers:["Hiiii 😭","Haaan bolo","Wtf. Hii.","Hello ji."]
 },
 {
  test:/love you|i love you/i,
  answers:["Love you too 😭","Acha bas. Itna bhi nahi.","Chup. 💗","Haan haan I know."]
 },
 {
  test:/miss you|i miss you/i,
  answers:["Acchaaa 😭","Acha toh yaad aa gayi meri?","Tum bhi na.","I know. Ab bata kya kar rahe ho."]
 },
 {
  test:/blush|blushing|shy/i,
  answers:["MAI NAHI BLUSH KAR RAHI.","Gawarrr. NO. 😭","Kuch bhi mat bolo.","Wtf😭😭"]
 },
 {
  test:/sorry|apolog/i,
  answers:["It's okay, but please understand why it bothered me.","Acha. Bas next time dhyaan rakhna.","I appreciate that you apologised. I just don't want the same thing to keep happening."]
 },
 {
  test:/angry|mad|upset/i,
  answers:["Obviously I have a reason. Suno pehle.","I'm not just randomly upset. There's a reason behind it.","Let me explain what actually bothered me."]
 },
 {
  test:/government|politic/i,
  answers:["GOVERNMENT KI MKC 100000 BAAR 😭","Bhai don't even get me started.","I have SO many things to say about this."]
 },
 {
  test:/ugly|beautiful|pretty|cute/i,
  answers:["Wtf😭","Accha ji.","Tum bhi na.","Kuch bhi."]
 },
 {
  test:/bored/i,
  answers:["Bgmi khelteyeye","Kuch karo jaake 😭","Let's find something to do."]
 },
 {
  test:/joke|funny/i,
  answers:["Tumhara existence hi kaafi hai 😭","Gawarrr.","I have better things to do."]
 },
 {
  test:/who are you|are you real/i,
  answers:["I'm AARATRIKA.AI, an AI-style simulation. Not the actual person 😭","I'm the artificial version. Thoda sambhal ke."]
 }
];

function choose(array){
 return array[Math.floor(Math.random()*array.length)];
}

function addMessage(text,type){
 const wrap=document.createElement("div");
 wrap.className="message "+type;

 const name=document.createElement("span");
 name.className="name";
 name.textContent=type==="user"?"YOU":"AARATRIKA.AI";

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 wrap.append(name,bubble);
 chat.appendChild(wrap);
 chat.scrollTop=chat.scrollHeight;
}

function respond(text){
 const lower=text.toLowerCase().trim();

 // Easter eggs
 if(lower==="/help"){
  return "SECRET COMMANDS 😭\n\n/help - show commands\n/lore - personality notes\n/chaos - maximum chaos\n/creator - reveal the creator";
 }

 if(lower==="/creator"){
  return "Made by someone who apparently has too much free time and a GitHub account. 😭";
 }

 if(lower==="/lore"){
  return "PERSONALITY FILE:\n\nCasual Hinglish.\nSarcastic humour.\nLong paragraphs when upset.\nHides embarrassment behind teasing.\nUses dramatic reactions.\nOccasionally affectionate.\n\nEND OF FILE.";
 }

 if(lower==="/chaos"){
  return "GOVERNMENT KI MKC 100000 BAAR 😭😭😭 GAWARRRR WTF HAATH TOD DUNGI BGMI KHELT EYEYE.";
 }

 // Special pattern recognition
 for(const pattern of patterns){
  if(pattern.test.test(text)){
   return choose(pattern.answers);
  }
 }

 // Contextual follow-ups
 if(/^(why|how|what|really|seriously)\??$/i.test(lower)){
  if(lastTopic==="affection")return "KYA WHY 😭";
  if(lastTopic==="angry")return "Because I literally just explained it.";
  return "Kya why? Thoda clearly bolo 😭";
 }

 // Mode response
 const response=choose(replies[mode]);

 if(mode==="angry")lastTopic="angry";
 else if(mode==="affection")lastTopic="affection";
 else lastTopic=mode;

 return response;
}

function sendMessage(text){
 text=text.trim();
 if(!text||send.disabled)return;

 addMessage(text,"user");
 history.push({role:"user",content:text});
 messageCount++;

 input.value="";
 input.style.height="auto";
 send.disabled=true;
 typing.style.display="block";

 const delay=500+Math.random()*900;

 setTimeout(()=>{
  const reply=respond(text);
  typing.style.display="none";
  addMessage(reply,"bot");
  history.push({role:"assistant",content:reply});
  send.disabled=false;
  input.focus();
 },delay);
}

send.addEventListener("click",()=>sendMessage(input.value));

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage(input.value);
 }
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,110)+"px";
});

document.querySelectorAll(".suggestions button").forEach(button=>{
 button.addEventListener("click",()=>{
  sendMessage(button.dataset.prompt);
 });
});

document.querySelectorAll(".modes button").forEach(button=>{
 button.addEventListener("click",()=>{
  mode=button.dataset.mode;
  document.querySelectorAll(".modes button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");

  addMessage("Mode changed to "+mode.toUpperCase()+". 😭","bot");
 });
});

document.getElementById("reset").addEventListener("click",()=>{
 history=[];
 messageCount=0;
 lastTopic="";
 chat.innerHTML="";
 addMessage("Wapas aa gaye? 😭 Ask something.","bot");
});
</script>
</body>
</html>
