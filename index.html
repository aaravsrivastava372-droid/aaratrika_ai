
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AARATRIKA.AI</title>
<style>
:root {
  --bg:#100b19;
  --panel:#1c1428;
  --panel2:#281c38;
  --purple:#b78aff;
  --pink:#f2a6dc;
  --text:#f6efff;
  --muted:#a99bb9;
  --border:#49345e;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at top,#302044 0,#100b19 55%);
  color:var(--text);font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:18px;
}
.app{
  width:100%;max-width:850px;height:calc(100vh - 36px);min-height:550px;
  display:flex;flex-direction:column;background:rgba(24,17,35,.96);
  border:1px solid var(--border);border-radius:22px;overflow:hidden;
  box-shadow:0 20px 80px #0008;
}
header{padding:20px 22px;background:#21172e;border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:20px;font-weight:850;letter-spacing:1px}
.brand span{color:var(--purple)}
.status{font-size:11px;color:#a9f0c1}
.status:before{content:"● ";color:#8bf0aa}
.subtitle{color:var(--muted);font-size:12px;margin-top:5px}
.modes{display:flex;gap:7px;overflow-x:auto;padding:13px 15px;background:#191222}
.modes button,.suggestions button{
  flex-shrink:0;border:1px solid var(--border);background:var(--panel2);
  color:#d9c9eb;border-radius:20px;padding:8px 13px;font-size:12px;cursor:pointer
}
.modes button.active{background:var(--purple);color:#1a1025;border-color:var(--purple);font-weight:800}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.message{max-width:85%;display:flex;flex-direction:column;gap:5px}
.message.user{align-self:flex-end;align-items:flex-end}
.message.bot{align-self:flex-start}
.name{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:800}
.bubble{padding:12px 15px;border-radius:17px;line-height:1.5;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:#7752a5;border-bottom-right-radius:5px}
.bot .bubble{background:#2a2037;border:1px solid #49345e;border-bottom-left-radius:5px}
.typing{color:var(--muted);font-size:12px;padding:0 20px 10px;display:none}
.bottom{padding:12px 15px 16px;background:#191222;border-top:1px solid var(--border)}
.suggestions{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px}
.suggestions button{font-size:11px}
.inputrow{display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:110px;min-height:45px;background:#2a2037;
border:1px solid var(--border);border-radius:14px;padding:12px;color:white;
font:inherit;outline:none}
textarea:focus{border-color:var(--purple)}
#send{background:var(--purple);border:0;border-radius:13px;padding:13px 19px;
font-weight:850;color:#1b1025;cursor:pointer;min-height:45px}
#send:disabled{opacity:.5;cursor:not-allowed}
.tools{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:10px}
.tools button{background:none;border:0;color:#c8a9f5;cursor:pointer}
.disclaimer{text-align:center;color:#786c85;font-size:10px;padding:8px}
@media(max-width:550px){
 body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;border:0}
 header{padding:16px}.brand{font-size:18px}#chat{padding:15px}
 .message{max-width:92%}.bubble{font-size:13px}
}
</style>
</head>
<body>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");

let mode = "normal";
let history = [];
let lastReply = {};
let totalResponses = Object.values(responses).reduce((n,a)=>n+a.length,0);

document.getElementById("counter").textContent =
  totalResponses + " handcrafted responses";

function addMessage(text,type){
 const wrap=document.createElement("div");
 wrap.className="message "+type;
 const name=document.createElement("span");
 name.className="name";
 name.textContent=type==="user"?"YOU":"AARATRIKA.AI";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;
 wrap.append(name,bubble);
 chat.appendChild(wrap);
 chat.scrollTop=chat.scrollHeight;
}

function choose(pool,category){
 if(!pool || !pool.length) return "Kya bolu ab 😭";
 let options=pool.filter(x=>x!==lastReply[category]);
 if(!options.length) options=pool;
 const chosen=options[Math.floor(Math.random()*options.length)];
 lastReply[category]=chosen;
 return chosen;
}

function detectCategory(text){
 const t=text.toLowerCase();

 if(/^(hi|hii|hiii|hello|hey|heyy|hlo|hola)\b/.test(t) ||
    /\bgood morning\b|\bgood evening\b/.test(t)) return "greeting";

 if(/\b(bye|goodnight|good night|gn|see you|gotta go)\b/.test(t)) return "bye";

 if(/\b(miss you|miss u|miss me|yaad|remember me)\b/.test(t)) return "miss";

 if(/\b(love you|love u|ily|i love you)\b/.test(t)) return "affection";

 if(/\b(beautiful|pretty|cute|gorgeous|amazing|handsome|lovely|compliment)\b/.test(t)) return "compliment";

 if(/\b(sorry|apologize|apologise|my mistake|forgive)\b/.test(t)) return "apology";

 if(/\b(upset|angry|hurt|sad|crying|annoyed|disappointed|problem|issue)\b/.test(t)) return "upset";

 if(/\b(wtf|what the|huh|seriously|wait what|confused|what happened)\b/.test(t)) return "confusion";

 if(/\b(hahaha|lol|lmao|rofl|funny|😂|🤣)\b/.test(t)) return "laugh";

 if(/\b(bored|boring|nothing to do|entertain me)\b/.test(t)) return "bored";

 if(/\b(bgmi|game|gaming|match|squad|lobby|rank|pubg)\b/.test(t)) return "gaming";

 if(/\b(think|life|meaning|existence|universe|philosophy|humanity|death|memory)\b/.test(t)) return "deep";

 if(/\b(why|how|what|when|where|who|which|explain|tell me)\b/.test(t)) return "question";

 if(/\b(gawar|rand|idiot|stupid|dumb|shut up|fuck off|annoying)\b/.test(t)) return "teasing";

 if(/\b(😭|!!!|omg|no way|unbelievable|can't believe)\b/.test(t)) return "dramatic";

 return "random";
}

function getReply(text){
 const category=detectCategory(text);
 let pool=responses[category] || responses.random;

 // Personality modes influence the style without changing the actual topic.
 if(mode==="angry" && category!=="upset" && category!=="apology"){
   pool=responses.teasing.concat(responses.dramatic);
 }
 if(mode==="affection"){
   pool=responses.affection.concat(responses.miss);
 }
 if(mode==="dramatic"){
   pool=responses.dramatic.concat(responses.confusion);
 }
 if(mode==="philosophical"){
   pool=responses.deep;
 }

 // Context-aware responses for consecutive messages.
 const previous=history.length ? history[history.length-1].content.toLowerCase() : "";
 if(category==="random" && previous.includes("miss")){
   pool=responses.affection.concat(responses.miss);
 }
 if(category==="question" && previous.includes("sorry")){
   pool=responses.apology.concat(responses.upset);
 }

 return choose(pool,category+"-"+mode);
}

function sendMessage(value){
 const text=value.trim();
 if(!text || send.disabled) return;

 if(text==="/help"){
   addMessage(text,"user");
   addMessage("Secret commands:\n/ help — show commands\n/creator — reveal the creator\n/lore — a little lore\n/chaos — maximum chaos\n/stats — response library stats", "bot");
   return;
 }
 if(text==="/creator"){
   addMessage(text,"user");
   addMessage("The person responsible for this entire questionable operation. 😭", "bot");
   return;
 }
 if(text==="/lore"){
   addMessage(text,"user");
   addMessage("Aaratrika.AI is a fan-made personality simulation built from conversational style examples. It does not know the real Aaratrika's private thoughts or memories.", "bot");
   return;
 }
 if(text==="/chaos"){
   addMessage(text,"user");
   addMessage(choose(responses.dramatic,"chaos"),"bot");
   return;
 }
 if(text==="/stats"){
   addMessage(text,"user");
   addMessage("Response library: "+totalResponses+" handcrafted lines across "+Object.keys(responses).length+" categories. Modes: 5. API keys: 0. 😭","bot");
   return;
 }

 addMessage(text,"user");
 history.push({role:"user",content:text});
 if(history.length>30) history.shift();

 input.value="";
 input.style.height="auto";
 send.disabled=true;
 typing.style.display="block";

 const delay=500+Math.random()*900;
 setTimeout(()=>{
   const reply=getReply(text);
   typing.style.display="none";
   addMessage(reply,"bot");
   history.push({role:"assistant",content:reply});
   if(history.length>30) history.shift();
   send.disabled=false;
   input.focus();
 },delay);
}

send.addEventListener("click",()=>sendMessage(input.value));

input.addEventListener("keydown",e=>{
 if(e.key==="Enter" && !e.shiftKey){
   e.preventDefault();
   sendMessage(input.value);
 }
});

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,110)+"px";
});

document.querySelectorAll(".suggestions button").forEach(button=>{
 button.addEventListener("click",()=>sendMessage(button.dataset.prompt));
});

document.querySelectorAll(".modes button").forEach(button=>{
 button.addEventListener("click",()=>{
   mode=button.dataset.mode;
   document.querySelectorAll(".modes button").forEach(b=>b.classList.remove("active"));
   button.classList.add("active");
   addMessage("Mode changed to "+mode.toUpperCase()+". 😭","bot");
 });
});

document.getElementById("reset").addEventListener("click",()=>{
 history=[];
 lastReply={};
 chat.innerHTML="";
 addMessage("Wapas aa gaye? 😭 Ask something.","bot");
});

addMessage("Hiiii. Kya kar rahe ho? 😭","bot");
</script>

</html>
